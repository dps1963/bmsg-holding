<form class="contact-card" data-contact-form data-brand="bmsg" data-endpoint="" novalidate>

<label for="contact-kind">Message type</label><select id="contact-kind" name="kind"><option value="contact">Contact</option><option value="feedback">Feedback</option></select>
<div class="contact-row"><div><label for="contact-name">Your name</label><input id="contact-name" name="name" placeholder="Jane Doe" autocomplete="name" maxlength="100" required spellcheck="false" aria-describedby="name-error"><span id="name-error" class="form-error"></span>
</div><div><label for="contact-email">Email for a reply</label><input id="contact-email" name="email" placeholder="you@example.com" type="email" autocomplete="email" maxlength="254" required spellcheck="false" autocapitalize="none" aria-describedby="email-error"><span id="email-error" class="form-error"></span>
</div></div>
<label for="contact-message">Your message</label><textarea id="contact-message" name="message" placeholder="Tell us what’s on your mind…" rows="5" maxlength="3800" required spellcheck="true" lang="en" aria-describedby="message-error"></textarea><span id="message-error" class="form-error"></span>
<div class="form-trap" aria-hidden="true"><label>Leave empty<input name="website" tabindex="-1" autocomplete="off" spellcheck="false"></label></div>
<button type="submit">Send message</button>
<p class="contact-note">Feedback is welcome. Avoid sensitive personal information or details about children. An anti-bot check prevents spam; BMSG Content Guard screens messages before support receives them. A receipt confirms storage, not delivery or a reply.</p>
<div data-challenge></div><p role="status" aria-live="polite" aria-atomic="true">Connecting to the contact service…</p>
<noscript>This form needs JavaScript and the security check to send a message.</noscript>
</form>
